name: CI

on:
  push:
    branches: [main]
    # Same opisy (README, docs) nie uruchamiają kompilacji; CHANGELOG tak — jest wbudowany w silnik.
    paths: ['**', '!**.md', '!docs/**', '!.github/ISSUE_TEMPLATE/**', 'CHANGELOG.md']
  pull_request:
    # Same opisy (README, docs) nie uruchamiają kompilacji; CHANGELOG tak — jest wbudowany w silnik.
    paths: ['**', '!**.md', '!docs/**', '!.github/ISSUE_TEMPLATE/**', 'CHANGELOG.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows — testy i kompilacja
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: rustup update stable --no-self-update
      # Pamięć kompilacji: przy zmianie Cargo.lock (np. numer wersji po wydaniu) bierze
      # poprzednią zamiast budować wszystko od zera (~3 min zamiast ~16).
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Testy silnika, aplikacji PC i wtyczki OBS
        run: cargo +stable test --locked -p limbochat-obs -p limbochat -p limbochat-obs-launcher
      - name: Składnia panelu
        run: |
          node --check obs-plugin/web/app.js
          node --check obs-plugin/web/studio.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Studio E2E — lokalne atrapy OBS i AI
        run: |
          cargo +stable build --locked -p limbochat-obs --bin limbochat-engine
          node tests/studio-e2e.mjs
      - name: Testy skryptów publikowania
        shell: powershell
        run: ./skrypty/testy.ps1
